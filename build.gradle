	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}

	outputs.file(layout.projectDirectory.file("HRDMetal.jar"))

	doLast {
		copy {
			from archiveFile
			into projectDir
			rename { "HRDMetal.jar" }
		}
	}
}

