plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def artifactProjectName = project.name

loom {
	accessWidenerPath = file("src/main/resources/metallum.accesswidener")
}

repositories {
	maven { url = uri("https://api.modrinth.com/maven") }
}

def isMacOs = System.getProperty("os.name").startsWith("Mac")
def isAppleSiliconMac = isMacOs && System.getProperty("os.arch") in ["aarch64", "arm64"]
def macNativeSource = layout.projectDirectory.file("src/main/native/MetallumNative.swift")
def macNativeLibrary = layout.buildDirectory.file("generated/metallum/natives/macos/libmetallum.dylib")
def macMetalSources = [
	Present: layout.projectDirectory.file("src/main/metal/MetallumPresent.metal"),
	HdrEffects: layout.projectDirectory.file("src/main/metal/MetallumHdrEffects.metal"),
	Clear: layout.projectDirectory.file("src/main/metal/MetallumClear.metal"),
	SodiumLightPatch: layout.projectDirectory.file("src/main/metal/MetallumSodiumLightPatch.metal")
]
def macMetalAirFiles = macMetalSources.collectEntries { name, ignored ->
	[(name): layout.buildDirectory.file("generated/metallum/shaders/${name}.air")]
}
def macBuiltinMetallib = layout.buildDirectory.file("generated/metallum/natives/macos/metallum.metallib")
def macNativeCompilerArguments = [
	"-O",
	"-whole-module-optimization",
	"-emit-library",
	"-module-name", "metallum_native",
	"-target", "arm64-apple-macosx14.0",
	"-framework", "Foundation",
	"-framework", "Metal",
	"-framework", "MetalFX",
	"-framework", "QuartzCore"
]
def swiftCompilerVersion = isMacOs ? providers.exec {
	commandLine "swiftc", "--version"
}.standardOutput.asText.map { it.trim() } : providers.provider { "not-macos" }
def macOsSdkVersion = isMacOs ? providers.exec {
	commandLine "xcrun", "--sdk", "macosx", "--show-sdk-version"
}.standardOutput.asText.map { it.trim() } : providers.provider { "not-macos" }
def metalCompilerVersion = isMacOs ? providers.exec {
	commandLine "xcrun", "--sdk", "macosx", "metal", "--version"
}.standardOutput.asText.map { it.trim() } : providers.provider { "not-macos" }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"
}

processResources {
	inputs.property "version", project.version
	from(macNativeLibrary) {
		into "natives/macos"
	}
	from(macBuiltinMetallib) {
		into "natives/macos"
	}
	from(macMetalSources.values()) {
		into "natives/macos/shaders"
	}

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.register("buildMacNative", Exec) {
	onlyIf { isMacOs }

	inputs.file(macNativeSource)
	inputs.property("compilerArguments", macNativeCompilerArguments)
	inputs.property("swiftCompilerVersion", swiftCompilerVersion)
	inputs.property("macOsSdkVersion", macOsSdkVersion)
	outputs.file(macNativeLibrary)

	workingDir project.projectDir
	doFirst {
		macNativeLibrary.get().asFile.parentFile.mkdirs()
	}

	commandLine "swiftc",
		*macNativeCompilerArguments,
		"-o", macNativeLibrary.get().asFile.absolutePath,
		macNativeSource.asFile.absolutePath
}

def macMetalCompileTasks = macMetalSources.collect { name, sourceFile ->
	tasks.register("compile${name}Metal", Exec) {
		onlyIf { isMacOs }

		inputs.file(sourceFile)
		inputs.property("metalCompilerVersion", metalCompilerVersion)
		inputs.property("macOsSdkVersion", macOsSdkVersion)
		outputs.file(macMetalAirFiles[name])

		doFirst {
			macMetalAirFiles[name].get().asFile.parentFile.mkdirs()
		}

		commandLine "xcrun", "--sdk", "macosx", "metal",
			"-std=metal3.1",
			"-mmacosx-version-min=14.0",
			"-c", sourceFile.asFile.absolutePath,
			"-o", macMetalAirFiles[name].get().asFile.absolutePath
	}
}

tasks.register("linkMacBuiltinMetallib", Exec) {
	onlyIf { isMacOs }
	dependsOn(macMetalCompileTasks)

	inputs.files(macMetalAirFiles.values())
	inputs.property("metalCompilerVersion", metalCompilerVersion)
	inputs.property("macOsSdkVersion", macOsSdkVersion)
	outputs.file(macBuiltinMetallib)

	doFirst {
		macBuiltinMetallib.get().asFile.parentFile.mkdirs()
	}

	commandLine "xcrun", "--sdk", "macosx", "metallib",
		*macMetalAirFiles.values().collect { it.get().asFile.absolutePath },
		"-o", macBuiltinMetallib.get().asFile.absolutePath
}

tasks.named("processResources") {
	dependsOn(tasks.named("buildMacNative"))
	dependsOn(tasks.named("linkMacBuiltinMetallib"))
}

