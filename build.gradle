plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def artifactProjectName = project.name

loom {
	accessWidenerPath = file("src/main/resources/metallum.accesswidener")
}

repositories {
	maven { url = uri("https://api.modrinth.com/maven") }
}

def isMacOs = System.getProperty("os.name").startsWith("Mac")
def isAppleSiliconMac = isMacOs && System.getProperty("os.arch") in ["aarch64", "arm64"]
def macNativeSource = layout.projectDirectory.file("src/main/native/MetallumNative.swift")
def macNativeLibrary = layout.buildDirectory.file("generated/metallum/natives/macos/libmetallum.dylib")
def macNativeCompilerArguments = [
	"-O",
	"-whole-module-optimization",
	"-emit-library",
	"-module-name", "metallum_native",
	"-target", "arm64-apple-macosx14.0",
	"-framework", "Foundation",
	"-framework", "Metal",
	"-framework", "MetalFX",
	"-framework", "QuartzCore"
]
def swiftCompilerVersion = isMacOs ? providers.exec {
	commandLine "swiftc", "--version"
}.standardOutput.asText.map { it.trim() } : providers.provider { "not-macos" }
def macOsSdkVersion = isMacOs ? providers.exec {
	commandLine "xcrun", "--sdk", "macosx", "--show-sdk-version"
}.standardOutput.asText.map { it.trim() } : providers.provider { "not-macos" }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"
}

processResources {
	inputs.property "version", project.version
	from(macNativeLibrary) {
		into "natives/macos"
	}

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.register("buildMacNative", Exec) {
	onlyIf { isMacOs }

	inputs.file(macNativeSource)
	inputs.property("compilerArguments", macNativeCompilerArguments)
	inputs.property("swiftCompilerVersion", swiftCompilerVersion)
	inputs.property("macOsSdkVersion", macOsSdkVersion)
	outputs.file(macNativeLibrary)

	workingDir project.projectDir
	doFirst {
		macNativeLibrary.get().asFile.parentFile.mkdirs()
	}

	commandLine "swiftc",
		*macNativeCompilerArguments,
		"-o", macNativeLibrary.get().asFile.absolutePath,
		macNativeSource.asFile.absolutePath
}

tasks.named("processResources") {
	dependsOn(tasks.named("buildMacNative"))
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs.add("-Xlint:deprecation")
}

tasks.register("hdrUnitTest", JavaExec) {
	group = "verification"
	description = "Runs the dependency-free HDR configuration tests"
	dependsOn(tasks.named("testClasses"))
	classpath = sourceSets.test.runtimeClasspath
	mainClass.set("com.metallum.client.hdr.HdrConfigTests")
}

tasks.register("metalRuntimeUnitTest", JavaExec) {
	group = "verification"
	description = "Runs dependency-free Metal runtime lifecycle tests"
	dependsOn(tasks.named("testClasses"))
	classpath = sourceSets.test.runtimeClasspath
	mainClass.set("com.metallum.client.metal.render.MetalRuntimeTests")
}

tasks.register("frameGraphValidation", JavaExec) {
	group = "verification"
	description = "Validates the typed Metal frame graph and versioned ABI header"
	dependsOn(tasks.named("testClasses"))
	classpath = sourceSets.test.runtimeClasspath
	mainClass.set("com.metallum.client.metal.render.framegraph.FrameGraphTests")
}

tasks.register("spatialScalingUnitTest", JavaExec) {
	group = "verification"
	description = "Runs MetalFX preset and render-resolution policy tests"
	dependsOn(tasks.named("testClasses"))
	classpath = sourceSets.test.runtimeClasspath
	mainClass.set("com.metallum.client.metalfx.SpatialScalingTests")
}

def hdrValueValidationBinary = layout.buildDirectory.file("native-tests/HdrValueValidation")
def spatialScalingValidationBinary = layout.buildDirectory.file("native-tests/SpatialScalingValidation")
def gpuTimingValidationBinary = layout.buildDirectory.file("native-tests/GpuTimingValidation")

tasks.register("compileGpuTimingValidation", Exec) {
	group = "verification"
	description = "Compiles the native Metal GPU counter validation harness"
	onlyIf { isAppleSiliconMac }

	inputs.file("src/test/native/GpuTimingValidation.swift")
	inputs.property("swiftCompilerVersion", swiftCompilerVersion)
	inputs.property("macOsSdkVersion", macOsSdkVersion)
	outputs.file(gpuTimingValidationBinary)

	doFirst {
		gpuTimingValidationBinary.get().asFile.parentFile.mkdirs()
	}

	commandLine "swiftc",
		"-O",
		"-parse-as-library",
		"-target", "arm64-apple-macosx14.0",
		"-framework", "Foundation",
		"-framework", "Metal",
		"-o", gpuTimingValidationBinary.get().asFile.absolutePath,
		"src/test/native/GpuTimingValidation.swift"
}

tasks.register("gpuTimingValidation", Exec) {
	group = "verification"
	description = "Validates hardware timestamp samples at render, compute and blit pass boundaries"
	onlyIf { isAppleSiliconMac }
	dependsOn(tasks.named("compileGpuTimingValidation"))

	environment "MTL_DEBUG_LAYER", "1"
	environment "MTL_SHADER_VALIDATION", "1"
	environment "MTL_SHADER_VALIDATION_REPORT_TO_STDERR", "1"
	commandLine gpuTimingValidationBinary.get().asFile.absolutePath
}

tasks.register("compileSpatialScalingValidation", Exec) {
	group = "verification"
	description = "Compiles the native MetalFX spatial scaling validation harness"
	onlyIf { isAppleSiliconMac }

	inputs.file("src/test/native/SpatialScalingValidation.swift")
	inputs.property("swiftCompilerVersion", swiftCompilerVersion)
	inputs.property("macOsSdkVersion", macOsSdkVersion)
	outputs.file(spatialScalingValidationBinary)

	doFirst {
		spatialScalingValidationBinary.get().asFile.parentFile.mkdirs()
	}

	commandLine "swiftc",
		"-O",
		"-parse-as-library",
		"-target", "arm64-apple-macosx14.0",
		"-framework", "Foundation",
		"-framework", "Metal",
		"-framework", "MetalFX",
		"-o", spatialScalingValidationBinary.get().asFile.absolutePath,
		"src/test/native/SpatialScalingValidation.swift"
}

tasks.register("spatialScalingValidation", Exec) {
	group = "verification"
	description = "Runs MetalFX HDR range, orientation and texture-contract checks"
	onlyIf { isAppleSiliconMac }
	dependsOn(tasks.named("compileSpatialScalingValidation"))

	environment "MTL_DEBUG_LAYER", "1"
	environment "MTL_SHADER_VALIDATION", "1"
	environment "MTL_SHADER_VALIDATION_REPORT_TO_STDERR", "1"
	commandLine spatialScalingValidationBinary.get().asFile.absolutePath
}

tasks.register("compileHdrValueValidation", Exec) {
	group = "verification"
	description = "Compiles the macOS Metal HDR numerical validation harness"
	onlyIf { isAppleSiliconMac }

	inputs.file("src/test/native/HdrValueValidation.swift")
	inputs.property("swiftCompilerVersion", swiftCompilerVersion)
	inputs.property("macOsSdkVersion", macOsSdkVersion)
	outputs.file(hdrValueValidationBinary)

	doFirst {
		hdrValueValidationBinary.get().asFile.parentFile.mkdirs()
	}

	commandLine "swiftc",
		"-O",
		"-parse-as-library",
		"-target", "arm64-apple-macosx14.0",
		"-framework", "AppKit",
		"-framework", "Foundation",
		"-framework", "Metal",
		"-framework", "QuartzCore",
		"-o", hdrValueValidationBinary.get().asFile.absolutePath,
		"src/test/native/HdrValueValidation.swift"
}

tasks.register("hdrValueValidation", Exec) {
	group = "verification"
	description = "Runs bounded GPU readback checks for HDR values and the native present ABI"
	onlyIf { isAppleSiliconMac }
	dependsOn(tasks.named("buildMacNative"), tasks.named("compileHdrValueValidation"))

	inputs.file("src/main/native/MetallumNative.swift")
	inputs.file(macNativeLibrary)

	environment "MTL_DEBUG_LAYER", "1"
	environment "MTL_SHADER_VALIDATION", "1"
	environment "MTL_SHADER_VALIDATION_REPORT_TO_STDERR", "1"
	commandLine hdrValueValidationBinary.get().asFile.absolutePath,
		file("src/main/native/MetallumNative.swift").absolutePath,
		macNativeLibrary.get().asFile.absolutePath
}

tasks.named("test", Test) {
	// HDR tests use a dependency-free Java entry point instead of a JUnit engine.
	failOnNoDiscoveredTests = false
}

tasks.named("check") {
	dependsOn(tasks.named("hdrUnitTest"))
	dependsOn(tasks.named("metalRuntimeUnitTest"))
	dependsOn(tasks.named("frameGraphValidation"))
	dependsOn(tasks.named("spatialScalingUnitTest"))
	dependsOn(tasks.named("hdrValueValidation"))
	dependsOn(tasks.named("spatialScalingValidation"))
	dependsOn(tasks.named("gpuTimingValidation"))
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}

	doLast {
		copy {
			from archiveFile
			into projectDir
			rename { "HRDMetal.jar" }
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
