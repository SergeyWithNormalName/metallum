tasks.register("compileLightClusterValidation", Exec) {
	group = "verification"
	description = "Compiles the native clustered-lighting ABI and GPU property harness"
	onlyIf { isAppleSiliconMac }

	inputs.file("src/test/native/LightClusterValidation.swift")
	inputs.property("swiftCompilerVersion", swiftCompilerVersion)
	inputs.property("macOsSdkVersion", macOsSdkVersion)
	outputs.file(lightClusterValidationBinary)

	doFirst {
		lightClusterValidationBinary.get().asFile.parentFile.mkdirs()
	}

	commandLine "swiftc",
		"-O",
		"-parse-as-library",
		"-target", "arm64-apple-macosx14.0",
		"-framework", "Foundation",
		"-framework", "Metal",
		"-o", lightClusterValidationBinary.get().asFile.absolutePath,
		"src/test/native/LightClusterValidation.swift"
}

